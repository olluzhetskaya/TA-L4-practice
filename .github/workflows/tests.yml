name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schemas, typecheck, eslint, ast-grep, pipeline gates, harness tests
        run: npm run validate

  playwright:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        if: matrix.project == 'ui'
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.project }} specs
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'
          TOOLSHOP_UI_URL: ${{ vars.TOOLSHOP_UI_URL }}
          TOOLSHOP_API_URL: ${{ vars.TOOLSHOP_API_URL }}
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
