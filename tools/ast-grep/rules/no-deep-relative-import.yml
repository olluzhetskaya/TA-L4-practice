id: no-deep-relative-import
message: "Relative import crosses two or more directories. Use a path alias (@data/*, @pages/*, @helpers/*, @fixtures)."
severity: error
language: TypeScript
files:
  - tests/**/*.ts
  - src/**/*.ts
rule:
  kind: string_fragment
  regex: '^(\.\./){2,}'
  inside:
    kind: import_statement
    stopBy: end
