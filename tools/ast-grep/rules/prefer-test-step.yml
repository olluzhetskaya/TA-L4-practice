id: prefer-test-step
message: "test() body has no test.step(...) — flat tests are hard to read in trace reports."
severity: error
language: TypeScript
files:
  - tests/**/*.spec.ts
rule:
  any:
    - pattern: test($NAME, async ($$$PARAMS) => { $$$BODY })
      not:
        has:
          pattern: test.step($$$)
          stopBy: end
    - pattern: test($NAME, $OPTIONS, async ($$$PARAMS) => { $$$BODY })
      not:
        has:
          pattern: test.step($$$)
          stopBy: end
